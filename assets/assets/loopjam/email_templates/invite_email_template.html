<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loopjam Invite</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#f9f9f9;">
    <table align="center" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#ffffff; margin:20px auto; border-radius:8px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.1);">
    
        <!-- Banner Section -->
        <tr>
            <td style="padding:0; text-align:center; background-color:#000000;">
                <img src="https://loopjam.blob.core.windows.net/loopjamweb/photos/images/1756852221091_email-banner2.png" alt="Event Banner" width="600" style="display:block; width:100%; max-width:600px; height:auto;">
            </td>
        </tr>
    
        <!-- Body Content -->
        <tr>
            <td style="padding:20px; color:#333333; font-size:16px; line-height:1.5;">
                <p>Hello <strong>{{attendeeName}}</strong>,</p>
                <p><strong>{{hostName}}</strong> has invited you to join <strong>{{eventName}}</strong> on Loopjam.</p>
                <p>It’s a shared event page where attendees can upload and view photos and videos together.</p>
        
                <!-- Button -->
                <table align="center" cellpadding="0" cellspacing="0" border="0" style="margin:30px auto;">
                    <tr>
                        <td bgcolor="#2218E2" style="border-radius:6px; text-align:center;">
                            <a href="{{joinEventLink}}" target="_blank" style="display:inline-block; padding:12px 24px; font-size:16px; color:#ffffff; text-decoration:none; font-weight:bold; border-radius:6px;">
                                Join Event
                            </a>
                        </td>
                    </tr>
                </table>
        
                <p style="font-size:14px; color:#777777;">You can contribute straight from your browser. No app download needed.</p>
            </td>
        </tr>
    
        <!-- Footer -->
        <tr>
            <td style="padding:20px; text-align:center; background-color:#f2f2f2;">
                <img src="https://loopjam.blob.core.windows.net/loopjamweb/photos/images/1756852307727_loopjam-Logo.png" alt="Loopjam Logo" width="100" style="margin-bottom:10px;">
                <p style="font-size:12px; color:#888888; margin:0;">&copy; Loopjam, All rights reserved.</p>
            </td>
        </tr>
    </table>
</body>
</html>
